<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Security. GitHub Pages can't send response headers, so the policy rides in a meta tag. It limits where the page may load
     scripts, images, fonts, video and data from (and where it may send requests), and blocks plugins, <base> hijacking and form posts.
     Inline script/style stay allowed because the whole site is one file. Real headers (frame-ancestors, HSTS) need a CDN in front. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://sw-rockbottom.com data: blob:; media-src 'self' https://sw-rockbottom.com; connect-src 'self' https://api.github.com https://cloudflareinsights.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location.href = window.self.location.href; } catch (e) {} }   /* never run inside someone else's frame (clickjacking) */</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>// Rock Bottom</title>
<meta name="description" content="Rock Bottom's Summoners War guild siege defense comps, defense placements, siege schedule and season awards.">
<link rel="icon" type="image/png" href="https://sw-rockbottom.com/images/logo.png">
<link rel="apple-touch-icon" href="https://sw-rockbottom.com/images/logo.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sw-rockbottom.com/">
<meta property="og:title" content="Rock Bottom - Siege Defense">
<meta property="og:description" content="Season defense comps &amp; defense placements for guild siege battles">
<meta property="og:site_name" content="Rock Bottom">
<meta property="og:image" content="https://sw-rockbottom.com/images/share-card.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Rock Bottom guild artwork from Summoners War: Sky Arena">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sw-rockbottom.com/images/share-card.jpg">
<link rel="canonical" href="https://sw-rockbottom.com/">
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the hero still: the video's first frame at full size, fetched early so the first screen is sharp before (or instead of) the video -->
<link rel="preload" as="image" href="images/hero-poster.webp" type="image/webp" fetchpriority="high">
<!-- Helvetica is the system face (Roboto/Arial stand in locally); only Noto Sans JP 400 is used, for running notes, and it loads without blocking the first paint -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap"></noscript>
<style>
:root{
  --black:#0a0b0d; --panel:#0f1114; --panel2:#13161a; --line:rgb(var(--white-rgb) / .16);
  --blue:#2f9bff; --sig:#ff5a1f;
  --white:#e9ecef; --grey:#8b9199;
  --display:Helvetica,Roboto,Arial,sans-serif;
  --ui:Helvetica,Roboto,Arial,sans-serif;
  --mono:Helvetica,Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  /* type roles: meta (names, tags) / label (nav, captions) / ui (buttons, hints) */
  --t-meta:11px; --t-label:12px; --t-ui:14px;
  --red:#ff3b3b; --yellow:#ffd400; --soft:#c9ced4;
  /* the same colours as r g b, for see-through versions: rgb(var(--white-rgb) / .3) */
  --white-rgb:233 236 239; --black-rgb:10 11 13; --blue-rgb:47 155 255; --red-rgb:255 59 59; --yellow-rgb:255 212 0;
  /* full white for pressed and hover fills, the headline white, and a neutral steel for scrollbars and off towers */
  --hi:#fff; --hi-rgb:255 255 255; --headline:#f1f3f5; --steel:#3a3f46;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:64px;background:var(--black)}
body{background:var(--black);color:var(--white);font:500 17px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}

:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.tabbar{display:none}
.skip{position:absolute;left:12px;top:-60px;background:var(--white);color:var(--black);padding:10px 16px;z-index:200;font:700 16px var(--display);text-transform:uppercase}
.skip:focus{top:12px}

/* header */
.top{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;align-items:stretch;justify-content:space-between;background:rgb(var(--black-rgb) / .9);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;padding:0 clamp(18px,3vw,40px);text-transform:uppercase;text-decoration:none;color:var(--white)}
.logo i{display:block;width:12px;height:30px;background:var(--white);transform:skewX(-18deg)}
.nav{display:flex;align-items:stretch}
.nav a{display:flex;align-items:center;padding:0 clamp(14px,2vw,28px);text-transform:uppercase;text-decoration:none;color:var(--grey);position:relative;transition:color .2s}
.nav a::after{content:"";position:absolute;bottom:0;background:var(--white);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav a:hover,.nav a.on{color:var(--white)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.season{position:relative;display:flex;align-self:stretch}
.sbtn{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;text-transform:uppercase;transition:background .2s}
.sbtn:hover{background:var(--white)}
.sbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;transition:transform .25s var(--ease)}
.season.open .sbtn svg{transform:rotate(180deg)}
.smenu{position:absolute;right:0;top:100%;min-width:250px;background:var(--black);padding:6px;display:none}
.season.open .smenu{display:block}
.sopt{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;padding:12px 14px;background:none;border:0;cursor:pointer;text-align:left;font:600 20px var(--display);text-transform:uppercase;color:var(--white)}
.sopt:hover,.sopt:focus-visible{background:var(--white);color:var(--black);outline:none}
.sbtn:focus-visible{outline:3px solid var(--black);outline-offset:-7px}

.sopt[aria-selected=true]:hover,.sopt[aria-selected=true]:focus-visible{color:var(--black)}

/* hero */
.hero{position:relative;min-height:clamp(700px,100svh,980px);display:flex;overflow:hidden;isolation:isolate;padding:110px clamp(20px,5vw,80px) 90px}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:0% 50%;z-index:-3;}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;}
.slash{position:absolute;z-index:-1;left:-6vw;bottom:-6%;width:46vw;height:62%;background:var(--white);clip-path:polygon(0 18%,100% 0,78% 100%,0 100%);opacity:.9}
.slash.b{left:auto;right:-4vw;top:62px;bottom:auto;width:7vw;height:42%;background:var(--blue);clip-path:polygon(40% 0,100% 0,60% 100%,0 100%);opacity:1}
.hero-in{position:relative;max-width:1400px;width:100%;margin:0 auto}
.hero h1{font:800 clamp(84px,15.5vw,236px)/.84 var(--display);text-transform:uppercase;}
.hero h1 span{display:block}

.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;font:700 20px var(--display);text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s,transform .25s var(--ease)}

.btn.fill:hover{background:var(--white);border-color:var(--white)}
.btn:active{transform:translateY(2px)}
/* the call-to-action buttons lean at the same angle as the titles and labels */

.cta-row .btn:active{transform:skewX(-8deg) translateY(2px)}
.cta-row .btn span{display:inline-flex;align-items:center;gap:10px;}
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:square;transition:transform .25s var(--ease)}
.btn:hover .ico.down{transform:translateY(3px)}
.btn:hover .ico.out{transform:translate(2px,-2px)}

/* score strip */
.score{background:var(--black);border-block:1px solid var(--line);position:relative}

/* sections */
.sec{padding:clamp(72px,9vw,120px) clamp(20px,5vw,80px)}
.in{max-width:1400px;margin:0 auto}
.h2,.sub b,.join h2{text-wrap:balance}
.note{text-wrap:pretty}
.h2{font:800 clamp(46px,7.4vw,112px)/.9 var(--display);text-transform:uppercase;display:flex;align-items:flex-end;flex-wrap:wrap}
.h2::before{content:"";background:var(--white);}
.alt{background:var(--panel);border-block:1px solid var(--line)}

/* lineup: portrait strips */
.cat{margin-bottom:62px}
.cat:last-child{margin-bottom:0}
.cat h3{font:600 30px var(--display);text-transform:uppercase;display:flex;align-items:center;margin-bottom:22px}
.cat h3::before{content:"";background:var(--white);}
.sfw{position:relative;max-width:560px;margin:-14px 0 14px}
.sf{display:flex;align-items:center;gap:12px;max-width:none;margin:0;padding:0 16px;background:rgb(var(--black-rgb) / .6);transition:border-color .2s}

.sf:focus-within{border-color:var(--white)}
.sicon{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2}
.sf input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--white);font:600 22px var(--display);text-transform:uppercase}
.sf input::placeholder{color:var(--grey)}
.sf input::-webkit-search-cancel-button{display:none}
.qx{background:none;color:var(--white);cursor:pointer;font:600 14px/1 var(--display);text-transform:uppercase;padding:8px 10px 6px}
.qx:hover{background:var(--white);color:var(--black)}
.sug{position:absolute;z-index:90;left:0;right:0;top:calc(100% + 6px);background:var(--black);padding:6px;display:grid;gap:2px;}
.sug button{display:flex;align-items:center;gap:12px;width:100%;padding:6px 12px 6px 6px;background:none;border:0;cursor:pointer;text-align:left;color:var(--white);font:600 18px/1.1 var(--display);text-transform:uppercase}
.sug .mon{width:44px;height:44px;object-fit:cover;flex:none;}
.sug span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug mark{background:none;}
.sug small{font:500 14px var(--display);color:var(--grey);white-space:nowrap}
.sug button:hover,.sug button.act{background:var(--white);color:var(--black)}
.sug button:hover mark,.sug button.act mark{color:var(--black);text-decoration:underline}
.sug button:hover small,.sug button.act small{color:var(--black)}
.res{min-height:1.5em;margin:0 0 30px;color:var(--grey);font:500 var(--t-label)/1.3 var(--display);text-transform:uppercase}
.res b{color:var(--white)}
.strip.nomatch,.cat.nomatch{display:none}
.slot.alt-hit .plus{background:var(--white)}
.strips{display:grid;gap:18px}
.strip{position:relative;display:flex;align-items:stretch;gap:8px;padding:8px;transition:transform .35s var(--ease),border-color .2s}
.strip:hover{transform:translateY(-4px);border-color:var(--white)}
.strip.open{z-index:70;}
.sn{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .2s}
.strip:hover .sn,.strip.open .sn{background:var(--white)}
.sn b{font:700 32px/1 var(--display);}
.sn span{font:600 var(--t-meta)/1 var(--display);text-transform:uppercase}
.stack{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{position:relative}
.art{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:0;background:var(--black);overflow:hidden;text-align:left}
button.art{cursor:pointer}
.art .mon{width:100%;height:100%;object-fit:cover;filter:contrast(1.05)}
.art b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgb(var(--black-rgb) / .9),transparent);font:600 var(--t-meta)/1 var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art::after{content:"";position:absolute;inset:0;border:4px solid var(--white);opacity:0;pointer-events:none;transition:opacity .15s}
button.art:hover::after,button.art:focus-visible::after,.slot.sel .art::after{opacity:1}
button.art:focus-visible{outline:0}
button.art:focus-visible::after{border-color:var(--white)}
.plus{position:absolute;z-index:2;font:700 14px/1 var(--display);letter-spacing:.03em}
.pop{position:absolute;z-index:80;left:50%;top:calc(100% + 6px);transform:translateX(-50%);min-width:200px;max-width:min(270px,92vw);background:var(--black);padding:6px;display:grid;gap:4px;box-shadow:0 24px 40px -16px rgb(var(--black-rgb) / .9)}
.pop.up{top:auto;bottom:calc(100% + 6px)}
.pop{animation:popIn .16s var(--ease)}
@keyframes popIn{from{opacity:0;translate:0 -6px}}
.slot.flash .art{animation:flash .35s var(--ease)}
@keyframes flash{from{filter:brightness(2.1)}}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px 6px 6px;background:none;border:0;cursor:pointer;text-align:left;font:600 17px/1.1 var(--display);text-transform:uppercase;color:var(--white)}
.pop button .mon{width:46px;height:46px;object-fit:cover;flex:none}
.pop button:hover,.pop button:focus-visible{background:var(--white);color:var(--black);outline:none}
body.pop-open .strip:not(.open){opacity:.35;transition:opacity .2s}
/* the defense being edited fades too; only the monster you're swapping (and its menu) stays at full strength */
.strip.open{background:rgb(var(--black-rgb) / .35);}
.strip.open .sn,.strip.open .slot:not(.is-open){opacity:.28;filter:brightness(.6);transition:opacity .2s,filter .2s}
.strip.open .slot.is-open .art::after{opacity:1}

/* placements: the siege map is a full-bleed backdrop that melts into the page, with lit hotspots and a glass panel on top */
.smap{position:relative;padding:clamp(56px,7vw,104px) 0 0;overflow:hidden}
.smap .in{padding:0 clamp(20px,5vw,80px)}
.smap-head{position:relative;z-index:9;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}

.stog{font:700 16px/1 var(--display);text-transform:uppercase;background:rgb(var(--black-rgb) / .62);padding:11px 18px 9px;cursor:pointer;transition:background .2s,color .2s;margin-bottom:8px}
.stog:hover{background:rgb(var(--hi-rgb) / .14)}

.stog:focus-visible,.hot:focus-visible{outline:3px solid var(--white);outline-offset:3px}

.mapbox{position:relative}

.smap-stage{position:relative;aspect-ratio:2600/1688;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);}
.smap-hots{position:absolute;inset:0}

.smap-hots{z-index:4}
/* animation layers: all CSS, all on top of the still, none of them touch the towers */

/* hotspots */
.hot{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}

.hot::before{content:"";position:absolute;opacity:0;pointer-events:none}
.hot:hover::before,.hot:focus-visible::before,.hot.on::before{opacity:1;transform:translateX(-50%) scale(1)}
.hot.main::before{border-color:var(--white);}
.hb{position:absolute;left:50%;top:-2%;display:flex;white-space:nowrap;font:800 clamp(13px,1.15vw,19px)/1 var(--display);opacity:0;pointer-events:none;transition:opacity .18s,transform .3s var(--ease);z-index:2}

.hot:hover .hb,.hot:focus-visible .hb,.hot.on .hb,.smap-stage.show-all .hb{opacity:1;transform:translate(-50%,-100%) skewX(-8deg)}
.hot.off{cursor:default}
.hot.off::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--black-rgb) / .68),rgb(var(--black-rgb) / 0));pointer-events:none}

.hot.off:hover .hb::after{content:"No defense set";font:600 .78em var(--ui);font-style:normal;letter-spacing:.04em;text-transform:none;color:var(--grey)}
/* light-up: the dim layer darkens the map, lit towers are redrawn bright from the picture itself */
.hot.on{background-repeat:no-repeat;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);}
.hot.on::before,.hot.on .hb{filter:none}
@keyframes lit{from{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
.maplinks{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:6px;padding-bottom:clamp(56px,7vw,96px);position:relative;z-index:8}

.tp{position:absolute;width:min(400px,38%);z-index:12;-webkit-backdrop-filter:blur(14px) saturate(1.2);}
.tp.is-empty{display:none}

.tp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.tp-head h3{font:700 30px/1 var(--display);text-transform:uppercase}
.tp-head h3 small{display:block;margin-top:6px;font:500 15px var(--ui);text-transform:none;}
.tp-note{margin:0;font:500 17px/1.4 var(--ui);color:var(--grey)}
.tp-x{background:none;color:var(--white);cursor:pointer;font:600 15px/1 var(--display);text-transform:uppercase;padding:9px 12px 7px;flex:none}
.tp-x:hover{background:var(--white);color:var(--black)}
.tp .strips{grid-template-columns:1fr;gap:10px}

.tp .strip{animation:stripIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*80ms + 120ms)}
@keyframes stripIn{from{clip-path:inset(0 100% 0 0);opacity:.5}}
@media (max-width:700px){
  
  .smap-scroll{-webkit-overflow-scrolling:touch;}

  .maphost{margin-top:-12px}

}

/* hall of fame */
.slabs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.slab{position:relative;overflow:hidden}
.slab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--white)}
.slab h3{font:500 var(--t-label)/1.2 var(--display);text-transform:uppercase;color:var(--grey)}
.slab .who{font:700 clamp(40px,4.6vw,66px)/1 var(--display);text-transform:uppercase;margin:10px 0 4px;word-break:break-word}

.slab.mvp::before{background:var(--blue)}
.slab.mvp::after{content:"MVP";position:absolute;font:700 120px/1 var(--display);}

/* schedule */
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.tile{position:relative;padding:16px 14px 12px;transition:border-color .2s,transform .3s var(--ease)}
.tile.done .d{opacity:.7}
.tile.done::after{content:"";position:absolute;inset:0;pointer-events:none}
.tiles.go .tile.done::after{animation:strike .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*24ms)}
@keyframes strike{from{clip-path:inset(0 100% 0 0)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tile:hover{border-color:var(--white);transform:translateY(-4px)}
.tile .s{font:500 var(--t-label)/1 var(--display);color:var(--grey);text-transform:uppercase}
.tile .d{font:700 32px/1 var(--display);text-transform:uppercase;margin:6px 0 4px;}
.tile .w{font:500 var(--t-label)/1 var(--display);text-transform:uppercase}
.nojs{max-width:900px;margin:0 auto;padding:60px 24px;font:600 22px/1.35 var(--ui)}
.nojs p+p{margin-top:16px}
.nojs a{color:var(--white)}
.note{margin-top:26px;color:var(--white);font:600 clamp(20px,2vw,28px)/1.2 var(--display);text-transform:uppercase}

/* join */
.join{position:relative;overflow:hidden;background:var(--white);padding:clamp(80px,10vw,140px) clamp(20px,5vw,80px)}
.join::before{content:"";position:absolute;}
.join .in{position:relative}
.join h2{font:800 clamp(64px,12vw,190px)/.84 var(--display);text-transform:uppercase}

.hero .btn.fill:hover{background:var(--white);border-color:var(--white);color:var(--black)}

.hero .btn.fill.solid:hover{background:var(--white);border-color:var(--white)}
.join .cta-row{margin-top:36px}

.join .btn.fill{background:var(--black);}
.join .btn.fill:hover{background:var(--white);color:var(--black);border-color:var(--black)}
.foot{display:grid;gap:4px;padding:26px clamp(20px,5vw,80px);color:var(--grey);background:var(--black)}

@media (max-width:1199px){.strips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}.slabs{grid-template-columns:1fr}}
@media (max-width:900px){
  .hot::after{content:"";inset:-6px}
  .tp,.tp.left,.tp.right{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:120;max-height:64vh;overflow:auto;}
  .tp.is-empty{display:none}
  .tp .strips{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media (max-width:700px){
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:110;background:rgb(var(--black-rgb) / .96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{position:relative;display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 4px;font:500 14px/1.1 var(--display);text-transform:uppercase;text-decoration:none;text-align:center;color:var(--grey)}
  .tabbar a.on{color:var(--white)}
  .tabbar a.on::before{content:"";position:absolute;top:0;background:var(--white)}
  body{padding-bottom:calc(54px + env(safe-area-inset-bottom))}
  body:has(.tp:not(.is-empty)) .tabbar{display:none}
  .strip{padding:6px;gap:6px}.sn{width:46px;}
  .stack{gap:4px}
  .strips{grid-template-columns:1fr;gap:12px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  
  .slash{width:80vw;height:40%}

  .logo{white-space:nowrap}

:root .smap-head .h2{font:700 clamp(34px,4.8vw,74px)/1 Helvetica,Roboto,Arial,sans-serif;letter-spacing:.01em;text-shadow:1.5px 0 rgb(var(--red-rgb) / .28),-1.5px 0 rgb(var(--blue-rgb) / .28)}

/* schedule: siege progress and the season-end rewards rule */
.sgp{margin:0 0 22px}
.sgp-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
.sgp-l,.sgp-meta,.sgp-c small{font:400 12px/1 Helvetica,Roboto,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.sgp-c{font:700 28px/1 Helvetica,Roboto,Arial,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.sgp-c small{margin-left:4px}
.sgp-bar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;height:8px}
.sgp-bar i{display:block;background:rgb(var(--white-rgb) / .12)}
.sgp-bar i.on{background:var(--white)}
.sgp-bar i.nx{background:none;box-shadow:inset 0 0 0 1px var(--white)}
.sgp-meta{margin-top:12px}
@media (max-width:700px){ .sgp-bar{gap:2px;height:7px} .sgp-c{font-size:22px} }
.sgp-bar{position:relative}
.sgp-cut{position:absolute;left:var(--at);top:-6px;bottom:-6px;width:0;pointer-events:auto}
.sgp-cut i{position:absolute;left:-1.5px;top:0;bottom:0;width:2px;background:var(--t-y,var(--yellow))}
.sgp-cut em{position:absolute;left:-1px;top:calc(100% + 6px);padding-left:8px;border-left:2px solid var(--t-y,var(--yellow));font:400 12px/1 Helvetica,Roboto,Arial,sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--t-y,var(--yellow));white-space:nowrap}
.sgp:has(.sgp-cut){padding-bottom:24px}
.sgp:has(.sgp-cut):has(.sgp-meta){padding-bottom:6px}
@media (max-width:700px){ .sgp-cut em{left:auto;right:1px;padding:0 8px 0 0;border-left:0;border-right:2px solid var(--t-y,var(--yellow))} }

/* polish: header fits on one line at tablet and small-laptop widths */
@media (min-width:701px) and (max-width:1100px){
  .logo{font-size:20px;white-space:nowrap;padding:0 clamp(14px,2.2vw,40px)}
  .nav a{font-size:14px;letter-spacing:.1em;padding:0 clamp(8px,1.2vw,18px);white-space:nowrap}
  .sbtn{font-size:15px;white-space:nowrap}
}
@media (min-width:701px) and (max-width:920px){
  :root .logo{font-size:17px;padding:0 14px}
  :root .nav a{font-size:12px;letter-spacing:.08em;padding:0 8px}
  :root .sbtn{font-size:13px;padding:0 10px 0 22px;gap:6px}
}
/* polish: phone hero stats readable (11px floor) */
@media (max-width:700px){ .hx-bug .bug-cell span{font-size:11px;letter-spacing:.04em;line-height:1.2} .hx-bug>div,.hx-bug>div:first-child{justify-content:flex-end} }
/* polish: footer credit, no lone last word */
.foot{letter-spacing:.04em}
.foot p{text-wrap:balance}
/* polish: phone schedule dates stay on one line so tile rows line up */
@media (max-width:700px){ :root .tile .d{font-size:18px;white-space:nowrap} }
/* the map's loops rest while it is off screen (class set by script) */
:root #placements.idle *,:root #placements.idle *::before,:root #placements.idle *::after{animation-play-state:paused}
/* tower hit area: the whole tower art, not just the base square */
.hot .hit{position:absolute;left:-14%;right:-14%;top:-93%;bottom:0}
.hot[data-k^="HQ"] .hit{left:-22%;right:-22%;top:-126%}
/* gold: warmer than Yellow Guild and never a guild colour; used by the hero dates rule, the scroll cue chevron and the active nav line */
:root{--gold:#d9a546;--gold-rgb:217 165 70;--gold-hi:#e6b862;--gold-ink:#e8c785}
/* hero dates: a short gold upright beside the season's dates, the year small beneath */
#hero .hdates{display:grid;gap:8px;justify-items:start;margin:clamp(26px,2.6vw,40px) 0 0;padding-left:16px;border-left:2px solid var(--gold);text-shadow:0 1px 8px rgb(var(--black-rgb) / .85)}
#hero .hdates[hidden]{display:none}
#hero .hdates b{font:700 clamp(19px,1.5vw,23px)/1 Helvetica,Roboto,Arial,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
#hero .hdates span{font:400 11px/1 Helvetica,Roboto,Arial,sans-serif;letter-spacing:.24em;color:var(--grey);font-variant-numeric:tabular-nums}
@media (max-width:700px){
  #hero .hdates{justify-items:center;margin-top:18px;padding:0;border:0}
  #hero .hdates b::before{content:"";display:inline-block;width:2px;height:.9em;margin-right:10px;vertical-align:-.1em;background:var(--gold)}
}
/* hero: no corner brackets */
#hero .hero-frame::before,#hero .hero-frame::after{display:none}
/* scroll cue: centred above the stats bar, a muted label and a slow bob; the arrow rests for reduced motion */
#hero .cue{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:clamp(16px,1.8vw,26px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 14px;
  font:400 11px/1 Helvetica,Roboto,Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--grey);text-decoration:none;text-shadow:0 1px 8px rgb(var(--black-rgb) / .85);transition:color .2s var(--ease)}
#hero .cue span{margin-right:-.22em}
#hero .cue svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgb(var(--black-rgb) / .95));animation:cueBob 2.2s ease-in-out infinite}
#hero .cue:hover{color:var(--white)}
#hero .cue:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@keyframes cueBob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){ #hero .cue svg{animation:none} }
/* cue, louder: a bold near-white label, a bigger gold chevron, and a soft dark pool behind both so they read over bright art */
#hero .cue{font-size:12px;font-weight:700;letter-spacing:.24em;color:rgb(var(--white-rgb) / .88);gap:6px;isolation:isolate}
#hero .cue span{margin-right:-.24em}
#hero .cue::before{content:"";position:absolute;inset:-14px -34px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--black-rgb) / .62),rgb(var(--black-rgb) / .3) 60%,transparent);pointer-events:none}
#hero .cue svg{width:24px;height:24px;stroke-width:2.2;color:var(--gold-ink)}
#hero .cue:hover{color:var(--hi)}
#hero .cue:hover svg{color:var(--gold-hi)}
@media (max-width:700px){
  :root .hx-bug{position:relative;margin-top:62px}

}
/* header fit: nothing in the header shrinks or wraps; if it does not fit, the script adds fit1 (tighter spacing), then fit2 (smaller type) */
.top>.logo,.top>.nav,.top>.season{flex-shrink:0}
.nav a,.logo{white-space:nowrap}
.top.fit1 .logo{padding-left:clamp(12px,1.6vw,24px);padding-right:clamp(12px,1.6vw,24px)}

.top.fit2 .nav a{font-size:12px}
.top.fit2 .logo{font-size:17px}

.wr-s{display:none;text-decoration:none;border:0}

/* active nav line: gold */
.nav a::after{background:var(--gold)}

:root .h2::before,:root .smap-head .h2::before{font:700 .9em/1 Helvetica,Roboto,Arial,sans-serif;letter-spacing:-.04em;margin:0}

/* monsters: live site first, local images folder as the fallback */
const mon=m=>`<img class="mon" src="${IMG_BASE+encodeURI(m.p)}.png" onerror="this.onerror=null;this.src='images/${encodeURI(m.p)}.png'" alt="${esc(m.n)}" width="100" height="100" loading="lazy" decoding="async">`;

/* â”€â”€ a defense: three stacked portraits; any slot with alternates can be swapped â”€â”€ */
let teamOf={};
const swKey=(uid,j)=>`${state.sn}|${uid}|${j}`;
function slotHTML(uid,j){
  const base=teamOf[uid][SLOTKEYS[j]], pool=[base,...(base.alts||[])], k=state.sw[swKey(uid,j)]||0, cur=pool[k];
  const others=pool.map((x,idx)=>({x,idx})).filter(o=>o.idx!==k), n=others.length;
  const inner=`${mon(cur)}<b title="${esc(cur.n)}">${esc(cur.n)}</b>${n?`<i class="plus" aria-hidden="true">+${n}</i>`:''}`;
  const art=n?`<button type="button" class="art" aria-haspopup="menu" aria-expanded="false" aria-label="${esc(cur.n)}, ${n} swap option${n>1?'s':''}">${inner}</button>`:`<div class="art">${inner}</div>`;
  const pop=n?`<div class="pop" role="menu" aria-label="Swap ${esc(cur.n)}" hidden>${others.map(o=>`<button type="button" role="menuitem" data-k="${o.idx}">${mon(o.x)}<span>${esc(o.x.n)}</span></button>`).join('')}</div>`:'';
  const q=state.q, hit=!!q&&pool.some(x=>x.n.toLowerCase().includes(q)), altOnly=hit&&!cur.n.toLowerCase().includes(q);
  return `<div class="slot${hit?' sel':''}${altOnly?' alt-hit':''}" data-uid="${uid}" data-j="${j}">${art}${pop}</div>`;
}
function stripHTML(uid,withCat,n){
  const [sid,i]=uid.split('-'), num=String(+i+1).padStart(2,'0');
  return `<article class="strip" style="--i:${n||0}" data-uid="${uid}" aria-label="${esc((CATSHORT[sid]||sid)+' defense '+(+i+1)+': '+SLOTKEYS.map(k=>teamOf[uid][k].n).join(', '))}"><div class="sn"><b>${num}</b>${withCat?`<span>${esc(CATSHORT[sid]||sid)}</span>`:''}</div><div class="stack">${[0,1,2].map(j=>slotHTML(uid,j)).join('')}</div></article>`;
}
function refreshSlot(uid,j){
  $$(`.slot[data-uid="${uid}"][data-j="${j}"]`).forEach(el=>{ el.outerHTML=slotHTML(uid,j); });
}

/* swap menu: open, clamp inside the screen, pick, close */
function closePops(refocus){
  $$('.pop:not([hidden])').forEach(p=>{
    p.hidden=true; p.classList.remove('up'); p.style.transform='';
    const slot=p.closest('.slot'), art=$('button.art',slot);
    if(art){ art.setAttribute('aria-expanded','false'); if(refocus) art.focus(); }
    p.closest('.strip').classList.remove('open');
  });
  $$('.slot.is-open').forEach(el=>el.classList.remove('is-open'));
  document.body.classList.remove('pop-open');
}
function openPop(slot){
  closePops();
  const art=$('button.art',slot), pop=$('.pop',slot); if(!pop) return;
  const vw=document.documentElement.clientWidth;
  pop.hidden=false; art.setAttribute('aria-expanded','true');
  slot.closest('.strip').classList.add('open'); slot.classList.add('is-open'); document.body.classList.add('pop-open');
  let r=pop.getBoundingClientRect();
  if(r.bottom>innerHeight-8 && slot.getBoundingClientRect().top-r.height-6>70){ pop.classList.add('up'); r=pop.getBoundingClientRect(); }
  let dx=0; if(r.left<8) dx=8-r.left; else if(r.right>vw-8) dx=vw-8-r.right;
  if(dx) pop.style.transform=`translateX(calc(-50% + ${Math.round(dx)}px))`;
  const first=$('button',pop); if(first) first.focus({preventScroll:true});
}
function pick(btn){
  const slot=btn.closest('.slot'), uid=slot.dataset.uid, j=+slot.dataset.j;
  closePops(false);
  state.sw[swKey(uid,j)]=+btn.dataset.k;
  refreshSlot(uid,j);
  $$(`.slot[data-uid="${uid}"][data-j="${j}"]`).forEach(el=>{ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),420); });
  const art=$(`.slot[data-uid="${uid}"][data-j="${j}"] button.art`); if(art) art.focus({preventScroll:true});
}

/* monster suggestions: a picture popup that opens only while you type */
let monIndex=[], sugIdx=-1;
function buildMonIndex(){
  const m=new Map();
  Object.entries(teamOf).forEach(([uid,t])=>SLOTKEYS.forEach(k=>[t[k],...(t[k].alts||[])].forEach(x=>{ const key=x.n.toLowerCase(), e=m.get(key)||{n:x.n,p:x.p,uids:new Set()}; e.uids.add(uid); m.set(key,e); })));
  monIndex=[...m.values()];
}
function closeSug(){ const sug=$('#sug'); sug.hidden=true; sug.innerHTML=''; sugIdx=-1; $('#q').setAttribute('aria-expanded','false'); $('#q').removeAttribute('aria-activedescendant'); }
function showSug(){
  const q=state.q, sug=$('#sug'); if(!q){ closeSug(); return; }
  const starts=e=>e.n.toLowerCase().startsWith(q)?0:1;
  const hits=monIndex.filter(e=>e.n.toLowerCase().includes(q)).sort((a,b)=>starts(a)-starts(b)||a.n.localeCompare(b.n)).slice(0,6);
  if(!hits.length){ closeSug(); return; }
  sug.innerHTML=hits.map((e,i)=>{ const i0=e.n.toLowerCase().indexOf(q), n=e.uids.size;
    return `<button type="button" role="option" id="sg${i}" data-n="${esc(e.n)}" aria-selected="false">${mon(e)}<span>${esc(e.n.slice(0,i0))}<mark>${esc(e.n.slice(i0,i0+q.length))}</mark>${esc(e.n.slice(i0+q.length))}</span><small>${n} ${n===1?'defense':'defenses'}</small></button>`; }).join('');
  sug.hidden=false; sugIdx=-1; $('#q').setAttribute('aria-expanded','true');
}
function moveSug(d){
  const items=$$('#sug button'); if(!items.length) return;
  sugIdx=(sugIdx+d+items.length)%items.length;
  items.forEach((b,i)=>{ b.classList.toggle('act',i===sugIdx); b.setAttribute('aria-selected',String(i===sugIdx)); });
  $('#q').setAttribute('aria-activedescendant',items[sugIdx].id);
}
function pickSug(name){ const q=$('#q'); q.value=name; state.q=name.toLowerCase(); applySearch(); closeSug(); q.focus(); }

/* search by monster: a defense stays if any slot has that monster, or lists it as a swap option */
function applySearch(){
  const q=state.q, res=$('#res'); $('#qx').hidden=!q;
  let shown=0;
  $$('#cats .cat').forEach(cat=>{
    let any=0;
    $$('.strip',cat).forEach(st=>{
      const t=teamOf[st.dataset.uid];
      const hit=!q||SLOTKEYS.some(k=>{ const b=t[k]; return [b,...(b.alts||[])].some(x=>x.n.toLowerCase().includes(q)); });
      st.classList.toggle('nomatch',!hit); if(hit){ any++; shown++; }
    });
    cat.classList.toggle('nomatch',!any);
  });
  $$('#cats .slot').forEach(sl=>{
    const uid=sl.dataset.uid, j=+sl.dataset.j, base=teamOf[uid][SLOTKEYS[j]], pool=[base,...(base.alts||[])], cur=pool[state.sw[swKey(uid,j)]||0];
    const hit=!!q&&pool.some(x=>x.n.toLowerCase().includes(q));
    sl.classList.toggle('sel',hit); sl.classList.toggle('alt-hit',hit&&!cur.n.toLowerCase().includes(q));
  });
  if(!q){ res.textContent=''; return; }
  const raw=$('#q').value.trim(), alt=$$('#cats .slot.alt-hit').length;
  res.innerHTML=shown?`<b>${shown}</b> ${shown===1?'defense uses':'defenses use'} "${esc(raw)}"${alt?`, ${alt} as a swap option (the white +N)`:''}`:`No defense uses "${esc(raw)}". Clear the search to see them all.`;
}

  box.hidden=!items.length;
}
function renderLineup(){

  }).join('')||'<p class="note">No defenses have been posted for this season yet.</p>';

}
let towerDefs={};

const hotBox=k=>{ const hq=k.startsWith('HQ'), w=hq?6.6:4.6, h=+(w*SM.ratio).toFixed(2), [x,y]=SM.towers[k]; return {w,h,l:+(x-w/2).toFixed(2),t:+(y-h/2).toFixed(2)}; };
/* tower art: the in-game fortresses (5-star spiked, 4-star gold-trimmed, the crystal HQ), one per guild colour */
function mkSVG(k){

function rng(seed){ let v=seed; return ()=>(v=(v*1664525+1013904223)%4294967296)/4294967296; }
function hotHTML(k){

  const X=v=>(v-mb.left).toFixed(1), Y=v=>(v-mb.top).toFixed(1), dir=toRight?1:-1, q=c=>link.querySelector('.'+c), path=q('tl-path');
  const px=toRight? left : left+w;
  let ay=Math.max(top+26,Math.min(cy,top+h-26));
  if(Math.abs(ay-cy)<16){ const alt=cy+(cy<top+h/2?18:-18); ay=Math.max(top+26,Math.min(alt,top+h-26)); }   // keep an angle even when the panel is level with the tower
  const pad=4, bl=hr.left+hr.width*.12-pad, br=hr.right-hr.width*.12+pad, bt=hr.top+hr.height*.08-pad, bb=hr.bottom-hr.height*.04+pad, arm=Math.min(10,(br-bl)*.22);
  const sx=(toRight? br : bl)+dir*3, sy=cy, up=ay<cy;
  let leg=Math.abs(ay-sy); const room=Math.abs(px-sx)-22; if(leg>room) leg=Math.max(0,room);
  const kx=sx+dir*leg, ky=sy+(ay>sy?1:-1)*leg;
  path.setAttribute('d',`M${X(sx)} ${Y(sy)} L${X(kx)} ${Y(ky)} L${X(kx)} ${Y(ay)} H${X(px)}`);
  q('tl-ret').setAttribute('d',[[bl,bt,1,1],[br,bt,-1,1],[bl,bb,1,-1],[br,bb,-1,-1]].map(([x,y,a,b])=>`M${X(x+a*arm)} ${Y(y)} H${X(x)} V${Y(y+b*arm)}`).join(' ')+` M${X(sx-dir*3)} ${Y(sy-3)} V${Y(sy+3)}`);
  const pa=ay+(up?5:-5), p0=kx+dir*7, p1=px-dir*9;
  q('tl-par').setAttribute('d',Math.abs(p1-p0)>8?`M${X(p0)} ${Y(pa)} H${X(p1)}`:'');
  const n=4; q('tl-node').setAttribute('d',`M${X(kx)} ${Y(ay-n)} L${X(kx+n)} ${Y(ay)} L${X(kx)} ${Y(ay+n)} L${X(kx-n)} ${Y(ay)} Z`);
  q('tl-tick').setAttribute('d',`M${X(px)} ${Y(ay-8)} V${Y(ay+8)}`);
  link.style.setProperty('--lc',getComputedStyle(tp).borderTopColor);
  link.classList.add('on');
  if(placePanel.k!==state.sel){ placePanel.k=state.sel; if(!reduce){ const L=path.getTotalLength(); path.style.transition='none'; path.style.strokeDasharray=L; path.style.strokeDashoffset=L; path.getBoundingClientRect(); path.style.transition='stroke-dashoffset .38s cubic-bezier(.16,1,.3,1)'; path.style.strokeDashoffset='0'; } }
  else if(!reduce){ path.style.transition='none'; path.style.strokeDasharray='none'; path.style.strokeDashoffset='0'; }
}
{ let raf=0; const req=()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; placePanel(); }); }; addEventListener('scroll',req,{passive:true}); addEventListener('resize',req); }
function paintPanel(){
  const tp=$('#tp'), L=lit(); paintHots();
  if(!state.sel){ tp.classList.add('is-empty'); tp.innerHTML=''; placePanel(); return; }
  tp.classList.remove('is-empty');
  { const xs=[...L].map(k=>SM.towers[k][0]), cx=xs.reduce((a,b)=>a+b,0)/xs.length/100; tp.classList.toggle('left',cx>0.5); tp.classList.toggle('right',cx<=0.5); }
  const k=state.sel; tp.dataset.k=tnum(k).padStart(2,'0'); tp.dataset.g=gOf(k);
  const ids=towerDefs[k]||[], also=[...L].filter(j=>j!==k).map(tname), sp=isSpecial(k), st=sp?0:starsOf(k);
  ids.forEach(u=>{ if(!teamOf[u]){ const [sid,i]=u.split('-'); const sec=S().sections.find(s=>s.id===sid); teamOf[u]=sec.teams[+i]; } });
  const meta=[sp?'Special Defense':'',st?st+' star':'',also.length?'Also lights '+also.join(', '):''].filter(Boolean).join(' \u00b7 ');
  requestAnimationFrame(placePanel);
  tp.innerHTML=`<div class="tp-head"><h3>${esc(tname(k))}${meta?`<small>${esc(meta)}</small>`:''}</h3><button type="button" class="tp-x">Close</button></div>`+(ids.length?`<div class="strips">${ids.map((u,n)=>stripHTML(u,true,n)).join('')}</div>`:`<p class="tp-note">${sp?'Special Defense base. No team is listed for it.':'No defense set for this base.'}</p>`);
  placePanel();
}
function selectTower(k,viaKey){
  closePops(); const was=state.sel; state.sel=(state.sel===k)?null:k; paintPanel();
  if(state.sel){ history.replaceState(null,'','#placements/'+state.sel);
    const sc=$('#smap-scroll'), h=$(`.hot[data-k="${state.sel}"]`); if(sc&&h&&sc.scrollWidth>sc.clientWidth){ sc.scrollTo({left:h.offsetLeft-sc.clientWidth/2,behavior:reduce?'auto':'smooth'}); }
    if(viaKey){ const x=$('.tp-x'); if(x) x.focus({preventScroll:true}); } }
  else { history.replaceState(null,'','#placements'); const h=$(`.hot[data-k="${was}"]`); if(h) h.focus({preventScroll:true}); }
}
function renderFame(){
  $('#slabs').innerHTML=S().awards.map(a=>`<article class="slab${a.mvp?' mvp':''}"><h3>${esc(a.title)}</h3><div class="who">${esc(a.name)}</div></article>`).join('')||'<p class="note">Awards for this season haven\'t been posted yet.</p>';
}
function renderSchedule(){
  const sc=S().schedule;
  const now=Date.now(), SIEGE_MS=36*3600*1000;   // a siege counts as done 36 hours after it starts
  $('#tiles').innerHTML=sc.map((s,idx)=>{const done=new Date(s.date).getTime()+SIEGE_MS<=now; return `<div class="tile${done?' done':''}" style="--i:${idx}"><div class="s">${esc(s.label)}</div><div class="d">${dUTC(s.date,{day:'numeric',month:'short'})}</div><div class="w">${dUTC(s.date,{weekday:'long'})}</div>${done?'<span class="sr">Done</span>':''}</div>`;}).join('');
  /* progress: sieges played out of the season's sieges, and the next one */
  const n=sc.length, played=sc.filter(s=>new Date(s.date).getTime()+SIEGE_MS<=now).length, nxt=sc.find(s=>new Date(s.date).getTime()+SIEGE_MS>now);
  /* season-end rewards: in the guild 30 days before the regular season ends (second day of the last pre-tourney siege); marked on the bar between the sieges either side of that date */
  const cut=n?new Date(new Date(sc[n-1].date).getTime()+864e5-30*864e5):null, before=cut?sc.filter(s=>new Date(s.date)<=cut).length:0;
  const mark=cut&&before>0&&before<n?`<span class="sgp-cut" style="--at:${(before/n*100).toFixed(3)}%" title="Be in the guild by this date to get the season-end rewards"><i></i><em>Rewards cut-off ${dUTC(cut.toISOString(),{day:'numeric',month:'short'})}</em></span>`:'';
  $('#sgp').innerHTML=n?`<div class="sgp-top"><span class="sgp-l">Siege progress</span><b class="sgp-c">${played}<small> / ${n} played</small></b></div><div class="sgp-bar" style="--n:${n}" role="img" aria-label="${played} of ${n} sieges played${cut&&before>0&&before<n?`; season-end rewards cut-off ${dUTC(cut.toISOString(),{day:'numeric',month:'long'})}`:''}">${sc.map((s,i)=>`<i class="${i<played?'on':nxt&&s===nxt?'nx':''}"></i>`).join('')}${mark}</div>${nxt?`<div class="sgp-meta">Next: ${esc(nxt.label)}, ${dUTC(nxt.date,{weekday:'short',day:'numeric',month:'short'})}</div>`:''}`:'';
  $('#sg-note').textContent=sc.length?S().range.replace(/ â€” /,' to '):'No siege schedule has been published for this season.';
}
function renderHeroX(){
  const st=S().stats||{};
  const bug=$('#hx-bug'), cue=$('#cue');
  bug.innerHTML=[[st.battles,'Battles'],[st.offenseWR,WRL('Offense')],[st.defenseWR,WRL('Defense')],[st.totalPts,'Total points']].filter(x=>x[0]).map(([v,l])=>`<div class="bug-cell"><span>${l}</span><b>${esc(v)}</b></div>`).join('');
  if(cue) bug.append(cue);   // the scroll cue rides on top of the stats bar; last child, so the cells' first-child rules hold
  renderHeroSeason();
}
// hero dates: "Jul 27 – Oct 30" and the year, from the season's range ("27 Jul 2026 — 30 Oct 2026")
function renderHeroSeason(){
  const box=$('#hdates'); if(!box) return;
  const M=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const parse=s=>{ const m=String(s||'').trim().match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/); if(!m) return null; const mo=M.indexOf(m[2].toLowerCase()); return mo<0?null:new Date(Date.UTC(+m[3],mo,+m[1])); };
  const [a,b]=String(S().range||'').split(/\s*[\u2013\u2014-]\s*/).map(parse);
  if(!a||!b){ box.hidden=true; return; }
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  $('#hd-range').textContent=`${fmt(a)} \u2013 ${fmt(b)}`;
  $('#hd-year').textContent=a.getUTCFullYear()===b.getUTCFullYear()?b.getUTCFullYear():`${a.getUTCFullYear()} \u2013 ${b.getUTCFullYear()}`;
  box.hidden=false;
}
function renderAll(){
  const sn=state.sn;
  $('#season-label').textContent='Season '+sn; $('#hero-season').textContent=sn; const hm=$('#hero-season-m'); if(hm) hm.textContent=`Siege Battle, Season ${sn}`;
  document.title=`// Rock Bottom`;
  $$('.sopt').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.s===sn)));
  closePops(); renderScore(); renderHeroX(); renderLineup(); renderMap(); renderFame(); renderSchedule();
}

/* season switch */
const seasonEl=$('#season'), seasonBtn=$('.sbtn',seasonEl);
const seasonKeys=Object.keys(D.seasons).sort((a,b)=>b-a);
$('#smenu').innerHTML=seasonKeys.map(k=>`<button class="sopt" type="button" role="option" data-s="${k}" aria-selected="false">Season ${k}</button>`).join('');
function setSeasonMenu(open){ seasonEl.classList.toggle('open',open); seasonBtn.setAttribute('aria-expanded',String(open)); if(open){ const sel=$('.sopt[aria-selected=true]')||$('.sopt'); sel.focus(); } }

/* a season change re-enters the data blocks (a quick fade and rise) so you can see something changed */
function enterAll(){
  if(reduce) return;
  ['#score-in','#cats','#maphost','#slabs','#tiles'].forEach((sel,i)=>{ const el=$(sel); if(el&&el.animate) el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:420,delay:i*40,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}); });
}

/* one click handler for the whole page */
document.addEventListener('click',e=>{
  const t=e.target;
  const sg=t.closest('#sug button'); if(sg){ pickSug(sg.dataset.n); return; }
  if(!t.closest('.sfw')) closeSug();
  const sopt=t.closest('.sopt'); if(sopt){ state.sn=sopt.dataset.s; setSeasonMenu(false); renderAll(); enterAll(); seasonBtn.focus(); return; }
  if(t.closest('.sbtn')){ setSeasonMenu(!seasonEl.classList.contains('open')); return; }
  if(seasonEl.classList.contains('open')) setSeasonMenu(false);
  const art=t.closest('button.art'); if(art){ const slot=art.closest('.slot'); if($('.pop:not([hidden])',slot)) closePops(); else openPop(slot); return; }
  const opt=t.closest('.pop button'); if(opt){ pick(opt); return; }
  if(t.closest('.pop')) return;
  closePops();
  const tog=t.closest('#smap-badges'); if(tog){ const on=tog.getAttribute('aria-pressed')!=='true'; tog.setAttribute('aria-pressed',String(on)); tog.textContent=on?'Hide all':'Show all'; const st=$('#smap-stage'); if(st) st.classList.toggle('show-all',on); placeTags(); return; }
  const hot=t.closest('.hot'); if(hot){ if(!hot.classList.contains('off')) selectTower(hot.dataset.k,e.detail===0); return; }
  if(t.closest('.tp-x')){ selectTower(state.sel); return; }
  if(state.sel && !t.closest('.tp') && !t.closest('.nav') && !t.closest('.season')){ state.sel=null; paintPanel(); history.replaceState(null,'','#placements'); }
});
$('#q').addEventListener('input',e=>{ state.q=e.target.value.trim().toLowerCase(); applySearch(); showSug(); });
$('#q').addEventListener('keydown',e=>{
  const open=!$('#sug').hidden;
  if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault(); e.stopPropagation(); moveSug(e.key==='ArrowDown'?1:-1); }
  else if(open&&e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); if(sugIdx>=0) pickSug($$('#sug button')[sugIdx].dataset.n); else closeSug(); }
  else if(open&&e.key==='Escape'){ e.stopPropagation(); closeSug(); }
});
$('.sfw').addEventListener('focusout',e=>{ if(!e.currentTarget.contains(e.relatedTarget)) closeSug(); });
$('#qx').addEventListener('click',()=>{ $('#q').value=''; state.q=''; applySearch(); closeSug(); $('#q').focus(); });
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/^(input|textarea|select)$/i.test(e.target.tagName)){ e.preventDefault(); $('#q').focus(); $('#q').scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'}); return; }
  if(e.key==='Escape'&&e.target.id==='q'&&e.target.value){ e.target.value=''; state.q=''; applySearch(); return; }
  if(e.key==='Escape'){
    if(seasonEl.classList.contains('open')){ setSeasonMenu(false); seasonBtn.focus(); return; }
    if($('.pop:not([hidden])')){ closePops(true); return; }
    if(state.sel){ selectTower(state.sel); }
    return;
  }
  const menu=e.target.closest&&(e.target.closest('.pop')||e.target.closest('.smenu'));
  if(menu&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault(); const items=$$('button',menu), i=items.indexOf(document.activeElement);
    items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();
  }
});
addEventListener('resize',()=>{ closePops(); if(!state.sel) paintPanel(); });

/* active nav link */
(function(){ const top=$('.top'), C=['fit1','fit2'];
  const over=()=>[...top.children].reduce((s,e)=>s+e.getBoundingClientRect().width,0)>top.clientWidth+.5;
  const fit=()=>{ top.classList.remove(...C); for(const c of C){ if(!over()) break; top.classList.add(c); } };

})();

['lineup','placements','fame','sieges'].forEach(id=>io.observe(document.getElementById(id)));

(()=>{ const m=/^#placements\/([a-z0-9]+)$/i.exec(location.hash); if(m){ const k=m[1].toUpperCase(); if(towerDefs[k]){ state.sel=k; paintPanel(); } } })();
